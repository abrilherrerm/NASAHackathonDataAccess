<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMERG México</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/vendor/geoman/leaflet-geoman.css">
<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/vendor/geoman/leaflet-geoman.js"></script>
<script src="/static/vendor/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg:#f7f8fa; --card:#ffffff; --text:#1d2330; --muted:#5b6475; --border:#dde1e8;
    --accent:#2a78d6; --series:#2a78d6; --state-line:#3b4252; --area:#d9480f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1218; --card:#171b23; --text:#e6e9ef; --muted:#9aa3b2; --border:#2a303b;
      --accent:#5598e7; --series:#5598e7; --state-line:#c9cfdb; --area:#ff8a4c;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 24px; border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:14px; }
  main { display:grid; grid-template-columns: minmax(340px, 1.1fr) 1.4fr; gap:16px; padding:16px 24px; }
  @media (max-width: 960px) { main { grid-template-columns:1fr; padding:16px; } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; min-width:0; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:10px; }
  label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  input, select, button { font:inherit; font-size:14px; padding:6px 8px; border-radius:6px;
    border:1px solid var(--border); background:var(--card); color:var(--text); }
  button { cursor:pointer; }
  select { max-width:260px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #map { width:100%; height:520px; border-radius:8px; }
  #ts { width:100%; height:420px; }
  .hint { font-size:13px; color:var(--muted); margin:8px 0 0; line-height:1.5; }
  .sel { display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:6px; min-height:28px; }
  .chip { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-top:10px; }
  .stat { border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
  .stat span { font-size:12px; color:var(--muted); }
  .stat b { display:block; font-size:18px; font-variant-numeric:tabular-nums; }
  .err { color:#c92a2a; font-size:14px; }
  /* Leyenda y lectura del mapa */
  .legend, .readout { background:var(--card); color:var(--text); padding:6px 10px; border-radius:6px;
    border:1px solid var(--border); font-size:12px; line-height:1.4; }
  .legend .bar { width:180px; height:10px; border-radius:3px; margin:4px 0 2px; }
  .legend .ticks { display:flex; justify-content:space-between; color:var(--muted); font-variant-numeric:tabular-nums; }
  .readout { min-width:170px; }
  .leaflet-tooltip.state-tip { font-size:12px; padding:2px 6px; }
</style>
</head>
<body>
<header>
  <h1>Precipitación diaria IMERG V07 — México</h1>
  <p id="meta">Cargando…</p>
</header>
<main>
  <section class="card">
    <div class="controls">
      <label>Mapa: acumulado desde <input type="date" id="mapStart"></label>
      <label>hasta <input type="date" id="mapEnd"></label>
      <button class="primary" onclick="loadMap()">Actualizar mapa</button>
      <label><span>&nbsp;</span>
        <span style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--text)">
          <input type="checkbox" id="showStates" checked> Estados</span></label>
      <label>Ver municipios de
        <select id="muniOf"><option value="">— ninguno —</option></select></label>
    </div>
    <div id="map"></div>
    <p class="hint">
      <b>Punto:</b> clic en el mapa. <b>Área:</b> dibuja un rectángulo o un polígono con los botones de la izquierda del mapa
      (puedes editarla o moverla). <b>Estado o municipio:</b> menú "Consultar" a la derecha.
    </p>
  </section>

  <section class="card">
    <div class="sel"><span class="chip" id="selType">—</span><b id="selName">Selecciona un punto o dibuja un área</b></div>
    <div class="controls">
      <label>Consultar estado
        <select id="qEnt"><option value="">— elegir —</option></select></label>
      <label>Municipio
        <select id="qMun" disabled><option value="">Todo el estado</option></select></label>
      <button onclick="selectMexico()">México completo</button>
    </div>
    <div class="controls">
      <label>Agregación
        <select id="freq">
          <option value="D">Diaria</option><option value="W">Semanal</option>
          <option value="MS" selected>Mensual</option><option value="YS">Anual</option>
        </select>
      </label>
      <label>Desde <input type="date" id="start"></label>
      <label>Hasta <input type="date" id="end"></label>
      <button class="primary" onclick="loadSeries()">Graficar</button>
    </div>
    <div id="ts"></div>
    <div class="stats" id="stats"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const fmt = (v, d = 1) => v == null ? '—' : Number(v).toLocaleString('es-MX', { maximumFractionDigits: d, minimumFractionDigits: d });

// Rampa secuencial azul (claro -> oscuro): poca lluvia -> mucha lluvia
const RAMP = ['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5',
              '#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];
const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const RAMP_RGB = RAMP.map(hex2rgb);
function colorFor(t) {                 // t en [0, 1]
  const x = Math.min(Math.max(t, 0), 1) * (RAMP_RGB.length - 1);
  const i = Math.floor(x), f = x - i, a = RAMP_RGB[i], b = RAMP_RGB[Math.min(i + 1, RAMP_RGB.length - 1)];
  return a.map((v, k) => Math.round(v + (b[k] - v) * f));
}

// ---------------- Estado de la app ----------------
let selection = null;      // {type:'point', lat, lon} | {type:'area', geometry, name} | {type:'mexico'}
let areaLayer = null, pointMarker = null, grid = null, rasterLayer = null, statesLayer = null;
let statesGeo = null, catalog = null, muniLayer = null, highlight = null;
const muniCache = {};
const ATTR_INEGI = 'Límites: INEGI, Marco Geoestadístico 2026';

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

// ---------------- Mapa ----------------
// zoomSnap 1 (zoom entero): evita costuras blancas entre teselas del mapa base
const map = L.map('map', { zoomSnap: 1 }).fitBounds([[14.4, -118.5], [32.8, -86.6]]);
L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${dark ? 'World_Dark_Gray_Base' : 'World_Light_Gray_Base'}/MapServer/tile/{z}/{y}/{x}`, {
  attribution: 'Mapa base &copy; Esri', maxZoom: 16,
}).addTo(map);
map.createPane('raster').style.zIndex = 350;   // debajo de estados y dibujos

// Herramientas de dibujo (Geoman)
map.pm.setLang('es');
map.pm.addControls({
  position: 'topleft', drawMarker: false, drawCircleMarker: false, drawPolyline: false,
  drawCircle: false, drawText: false, cutPolygon: false, rotateMode: false,
});
map.pm.setPathOptions({ color: css('--area'), weight: 2, fillOpacity: 0.08 });

const busyDrawing = () => map.pm.globalDrawModeEnabled() || map.pm.globalEditModeEnabled()
  || map.pm.globalRemovalModeEnabled() || map.pm.globalDragModeEnabled();

map.on('pm:create', e => {
  if (areaLayer) map.removeLayer(areaLayer);       // una sola área activa
  areaLayer = e.layer;
  areaLayer.on('pm:edit pm:dragend', () => selectArea());
  areaLayer.on('click', ev => { L.DomEvent.stopPropagation(ev); if (!busyDrawing()) selectArea(); });
  selectArea();
});
map.on('pm:remove', e => {
  if (e.layer === areaLayer) { areaLayer = null; if (selection?.type === 'area') selectMexico(); }
});

map.on('click', e => {
  if (busyDrawing()) return;
  clearEntityMenus();
  selection = { type: 'point', lat: +e.latlng.lat.toFixed(3), lon: +e.latlng.lng.toFixed(3) };
  if (!pointMarker) pointMarker = L.circleMarker(e.latlng, { radius: 6, color: '#fff', weight: 2,
    fillColor: css('--area'), fillOpacity: 1 }).addTo(map);
  else pointMarker.setLatLng(e.latlng).addTo(map);
  loadSeries();
});

// Lectura bajo el cursor: coordenadas + acumulado del mapa
const readout = L.control({ position: 'bottomleft' });
readout.onAdd = () => { const d = L.DomUtil.create('div', 'readout'); d.id = 'readout'; d.textContent = 'Mueve el cursor sobre el mapa'; return d; };
readout.addTo(map);
map.on('mousemove', e => {
  const { lat, lng } = e.latlng;
  let txt = `${lat.toFixed(2)}, ${lng.toFixed(2)}`;
  const v = valueAt(lat, lng);
  if (v != null) txt += ` · <b>${fmt(v)} mm</b>`;
  $('readout').innerHTML = txt;
});

// Leyenda
const legend = L.control({ position: 'bottomright' });
legend.onAdd = () => { const d = L.DomUtil.create('div', 'legend'); d.id = 'legend'; return d; };
legend.addTo(map);

// Estados INEGI (solo referencia: contorno + nombre al pasar el cursor)
const refTooltip = (layer, text) => layer.bindTooltip(text, { sticky: true, className: 'state-tip', direction: 'top', offset: [0, -8] });
fetch('/static/boundaries/estados.geojson').then(r => r.json()).then(gj => {
  statesGeo = gj;
  statesLayer = L.geoJSON(gj, {
    style: { color: css('--state-line'), weight: 0.8, opacity: 0.7, fill: true, fillOpacity: 0 },
    pmIgnore: true, attribution: ATTR_INEGI,
    onEachFeature: (f, layer) => {
      refTooltip(layer, f.properties.NOMGEO);
      layer.on('mouseover', () => layer.setStyle({ weight: 2, opacity: 1 }));
      layer.on('mouseout', () => statesLayer.resetStyle(layer));
    },
  }).addTo(map);
});
$('showStates').onchange = e => statesLayer && (e.target.checked ? statesLayer.addTo(map) : map.removeLayer(statesLayer));

// Municipios: solo se descarga la entidad elegida (y se guarda en memoria)
async function getMunicipios(cveEnt) {
  if (!muniCache[cveEnt]) muniCache[cveEnt] = await getJSON(`/static/boundaries/municipios/${cveEnt}.geojson`);
  return muniCache[cveEnt];
}
async function showMunicipios(cveEnt) {
  if (muniLayer) { map.removeLayer(muniLayer); muniLayer = null; }
  if (!cveEnt) return;
  const gj = await getMunicipios(cveEnt);
  muniLayer = L.geoJSON(gj, {
    style: { color: css('--state-line'), weight: 0.6, opacity: 0.8, dashArray: '3 3', fill: true, fillOpacity: 0 },
    pmIgnore: true, attribution: ATTR_INEGI,
    onEachFeature: (f, layer) => {
      refTooltip(layer, `${f.properties.NOMGEO} <span style="opacity:.6">${f.properties.CVEGEO}</span>`);
      layer.on('mouseover', () => layer.setStyle({ weight: 2, dashArray: null }));
      layer.on('mouseout', () => muniLayer.resetStyle(layer));
    },
  }).addTo(map);
  map.fitBounds(muniLayer.getBounds(), { padding: [10, 10] });
}
$('muniOf').onchange = e => showMunicipios(e.target.value);

// Contorno resaltado de la entidad consultada (no interactivo)
function setHighlight(feature, fitTo) {
  if (highlight) { map.removeLayer(highlight); highlight = null; }
  if (!feature) return;
  highlight = L.geoJSON(feature, { style: { color: css('--area'), weight: 2.5, fill: false },
    interactive: false, pmIgnore: true }).addTo(map);
  // Encuadra el estado (no el municipio) para conservar contexto
  if (fitTo) map.fitBounds(L.geoJSON(fitTo).getBounds(), { padding: [20, 20] });
}

// Menús de consulta a partir del catálogo INEGI
async function loadCatalog() {
  catalog = await getJSON('/static/boundaries/catalogo.json');
  const opts = catalog.estados.map(e => `<option value="${e.cve}">${e.nombre}</option>`).join('');
  $('qEnt').insertAdjacentHTML('beforeend', opts);
  $('muniOf').insertAdjacentHTML('beforeend', opts);
}
$('qEnt').onchange = e => {
  const ent = catalog.estados.find(x => x.cve === e.target.value);
  $('qMun').innerHTML = '<option value="">Todo el estado</option>' +
    (ent ? ent.municipios.map(m => `<option value="${m.cve}">${m.nombre}</option>`).join('') : '');
  $('qMun').disabled = !ent;
  if (ent) selectEntity(ent.cve);
};
$('qMun').onchange = e => selectEntity(e.target.value || $('qEnt').value);

// Ráster de precipitación: canvas reproyectado a Web Mercator para que cuadre con el mapa base
function mercY(lat) { const r = lat * Math.PI / 180; return Math.log(Math.tan(Math.PI / 4 + r / 2)); }

function drawRaster(d) {
  const nLat = d.lat.length, nLon = d.lon.length;
  const dLat = d.lat[1] - d.lat[0], dLon = d.lon[1] - d.lon[0];
  const south = d.lat[0] - dLat / 2, north = d.lat[nLat - 1] + dLat / 2;
  const west = d.lon[0] - dLon / 2, east = d.lon[nLon - 1] + dLon / 2;
  const vals = d.z.flat().filter(v => v != null).sort((a, b) => a - b);
  const vmax = vals.length ? Math.max(vals[Math.floor(vals.length * 0.98)], 1) : 1;  // percentil 98

  const W = nLon * 3, yN = mercY(north), yS = mercY(south);
  const H = Math.round(W * (yN - yS) / ((east - west) * Math.PI / 180));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'); const cw = W / nLon;
  for (let i = 0; i < nLat; i++) {
    const y0 = (yN - mercY(d.lat[i] + dLat / 2)) / (yN - yS) * H;
    const y1 = (yN - mercY(d.lat[i] - dLat / 2)) / (yN - yS) * H;
    for (let j = 0; j < nLon; j++) {
      const v = d.z[i][j]; if (v == null) continue;
      const [r, g, b] = colorFor(v / vmax);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(Math.floor(j * cw), Math.floor(y0), Math.ceil(cw), Math.ceil(y1 - y0) + 1);
    }
  }
  if (rasterLayer) map.removeLayer(rasterLayer);
  rasterLayer = L.imageOverlay(cv.toDataURL(), [[south, west], [north, east]],
    { opacity: 0.8, pane: 'raster', interactive: false }).addTo(map);

  grid = { ...d, dLat, dLon };
  $('legend').innerHTML = `<div>Precipitación acumulada (mm)</div>
    <div class="bar" style="background:linear-gradient(to right, ${RAMP.join(',')})"></div>
    <div class="ticks"><span>0</span><span>${fmt(vmax / 2, 0)}</span><span>≥ ${fmt(vmax, 0)}</span></div>
    <div style="color:var(--muted)">${d.start} → ${d.end}</div>`;
}

function valueAt(lat, lon) {
  if (!grid) return null;
  const i = Math.round((lat - grid.lat[0]) / grid.dLat), j = Math.round((lon - grid.lon[0]) / grid.dLon);
  return grid.z[i]?.[j] ?? null;
}

async function loadMap() {
  try {
    drawRaster(await getJSON(`/api/map?start=${$('mapStart').value}&end=${$('mapEnd').value}&step=1`));
  } catch (e) { $('legend').innerHTML = `<span class="err">Mapa: ${e.message}</span>`; }
}

// ---------------- Selección y series ----------------
function clearEntityMenus() { $('qEnt').value = ''; $('qMun').value = ''; $('qMun').disabled = true; setHighlight(null); }

function selectArea() {
  if (!areaLayer) return;
  if (pointMarker) map.removeLayer(pointMarker);
  clearEntityMenus();
  const isRect = areaLayer instanceof L.Rectangle;
  selection = { type: 'area', geometry: areaLayer.toGeoJSON().geometry, name: isRect ? 'Rectángulo dibujado' : 'Polígono dibujado' };
  loadSeries();
}
function selectMexico() {
  if (pointMarker) map.removeLayer(pointMarker);
  clearEntityMenus();
  selection = { type: 'entity', cve: '00' };
  loadSeries();
}

async function selectEntity(cve) {
  if (pointMarker) map.removeLayer(pointMarker);
  selection = { type: 'entity', cve };
  loadSeries();
  const state = statesGeo?.features.find(f => f.properties.CVE_ENT === cve.slice(0, 2));
  const feat = cve.length === 2 ? state
    : (await getMunicipios(cve.slice(0, 2))).features.find(f => f.properties.CVEGEO === cve);
  setHighlight(feat, state);
}

async function fetchSeries() {
  const common = { freq: $('freq').value, start: $('start').value, end: $('end').value };
  if (selection.type === 'point')
    return getJSON('/api/timeseries/point?' + new URLSearchParams({ ...common, lat: selection.lat, lon: selection.lon }));
  if (selection.type === 'area')
    return getJSON('/api/timeseries/polygon', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...common, geometry: selection.geometry, name: selection.name }) });
  try {
    return await getJSON(`/api/timeseries/entity/${selection.cve}?` + new URLSearchParams(common));
  } catch (e) {   // sin series precalculadas: México por rectángulo como respaldo
    if (selection.cve !== '00') throw e;
    return getJSON('/api/timeseries/region?' + new URLSearchParams(common));
  }
}

async function loadSeries() {
  if (!selection) return;
  $('selType').textContent = selection.type === 'entity'
    ? (selection.cve === '00' ? 'México' : selection.cve.length === 2 ? 'Estado' : 'Municipio')
    : { point: 'Punto', area: 'Área' }[selection.type];
  $('selName').textContent = 'Cargando…';
  try {
    const d = await fetchSeries();
    const name = selection.type === 'entity' && selection.cve === '00' ? 'Promedio de México' : d.label;
    $('selName').textContent = name;
    const daily = d.freq === 'D';
    const unit = daily ? 'mm/día' : 'mm';
    const trace = daily
      ? { type: 'scatter', mode: 'lines', x: d.dates, y: d.values, line: { color: css('--series'), width: 1.5 },
          hovertemplate: `%{x|%d %b %Y}<br><b>%{y:.1f} ${unit}</b><extra></extra>` }
      : { type: 'bar', x: d.dates, y: d.values, marker: { color: css('--series') },
          hovertemplate: `%{x|${d.freq === 'YS' ? '%Y' : d.freq === 'MS' ? '%b %Y' : 'semana del %d %b %Y'}}<br><b>%{y:.1f} ${unit}</b><extra></extra>` };
    const grid = dark ? '#2a303b' : '#e6e9ef';
    const layout = {
      paper_bgcolor: css('--card'), plot_bgcolor: css('--card'), font: { color: css('--text'), size: 12 },
      margin: { l: 56, r: 16, t: 10, b: 40 }, bargap: 0.15, hovermode: 'x',
      yaxis: { title: { text: daily ? 'mm/día' : 'mm acumulados' }, gridcolor: grid, zeroline: false, rangemode: 'tozero' },
      xaxis: { type: 'date', gridcolor: grid, rangeslider: { visible: true, thickness: 0.08 } },
    };
    await Plotly.react('ts', [trace], layout, { responsive: true, displaylogo: false });

    const s = d.stats;
    const tiles = [
      ['Total del periodo', `${fmt(s.total_mm)} mm`],
      [`Promedio ${{ D: 'diario', W: 'semanal', MS: 'mensual', YS: 'anual' }[d.freq]}`, `${fmt(s.mean)} ${unit}`],
      ['Máximo', `${fmt(s.max)} ${unit}`],
      ['Fecha del máximo', s.max_date ?? '—'],
    ];
    if (d.area_km2 != null) {
      tiles.push(['Área con datos', `${fmt(d.area_km2, 0)} km²`]);
      tiles.push(['Volumen precipitado', `${fmt(s.volume_hm3, 0)} hm³`]);
    }
    $('stats').innerHTML = tiles.map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
  } catch (e) {
    $('selName').textContent = '—';
    $('stats').innerHTML = `<span class="err">${e.message}</span>`;
    Plotly.purge('ts');
  }
}
$('freq').onchange = loadSeries;

// ---------------- Inicio ----------------
async function init() {
  const info = await getJSON('/api/info');
  $('meta').textContent = `${info.start} → ${info.end} · ${info.n_days.toLocaleString('es-MX')} días · resolución ${info.resolution_deg}°`;
  for (const id of ['start', 'end', 'mapStart', 'mapEnd']) { $(id).min = info.start; $(id).max = info.end; }
  $('start').value = info.start; $('end').value = info.end;
  const y = info.end.slice(0, 4);
  $('mapStart').value = `${y}-01-01` < info.start ? info.start : `${y}-01-01`;
  $('mapEnd').value = info.end;
  await Promise.all([loadMap(), loadCatalog().catch(() => {})]);
  selectMexico();
}
init().catch(e => $('meta').innerHTML = `<span class="err">Error: ${e.message}</span>`);
</script>
</body>
</html>
