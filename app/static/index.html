<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMERG México</title>
<script src="/static/vendor/plotly-2.35.2.min.js"></script>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --text:#1d2330; --muted:#5b6475; --accent:#1f6feb; --border:#dde1e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#171b23; --text:#e6e9ef; --muted:#9aa3b2; --accent:#4c8dff; --border:#2a303b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 24px; border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; color:var(--muted); font-size:14px; }
  main { display:grid; grid-template-columns: minmax(320px, 1fr) 2fr; gap:16px; padding:16px 24px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; padding:16px; } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:10px; }
  label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  input, select, button { font:inherit; padding:6px 8px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  .stats { display:flex; gap:20px; flex-wrap:wrap; font-size:14px; margin-top:8px; }
  .stats b { display:block; font-size:18px; }
  #map, #ts { width:100%; height:460px; }
  .hint { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Precipitación diaria IMERG V07 — México</h1>
  <p id="meta">Cargando…</p>
</header>
<main>
  <section class="card">
    <div class="controls">
      <label>Mapa desde <input type="date" id="mapStart"></label>
      <label>hasta <input type="date" id="mapEnd"></label>
      <button onclick="loadMap()">Actualizar mapa</button>
    </div>
    <div id="map"></div>
    <p class="hint">Haz clic en el mapa para ver la serie de ese punto.</p>
  </section>
  <section class="card">
    <div class="controls">
      <label>Modo
        <select id="mode"><option value="point">Punto</option><option value="region">Promedio México</option></select>
      </label>
      <label>Lat <input type="number" id="lat" step="0.1" value="19.43" style="width:90px"></label>
      <label>Lon <input type="number" id="lon" step="0.1" value="-99.13" style="width:90px"></label>
      <label>Agregación
        <select id="freq"><option value="D">Diaria</option><option value="W">Semanal</option>
          <option value="MS" selected>Mensual</option><option value="YS">Anual</option></select>
      </label>
      <label>Desde <input type="date" id="start"></label>
      <label>Hasta <input type="date" id="end"></label>
      <button onclick="loadSeries()">Graficar</button>
    </div>
    <div id="ts"></div>
    <div class="stats" id="stats"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const baseLayout = () => ({
  paper_bgcolor: css('--card'), plot_bgcolor: css('--card'),
  font: { color: css('--text') }, margin: { l: 50, r: 20, t: 30, b: 40 },
});

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}

async function init() {
  const info = await getJSON('/api/info');
  $('meta').textContent = `${info.start} → ${info.end} · ${info.n_days} días · resolución ${info.resolution_deg}°`;
  for (const id of ['start', 'mapStart']) { $(id).min = info.start; $(id).max = info.end; }
  for (const id of ['end', 'mapEnd']) { $(id).min = info.start; $(id).max = info.end; }
  $('start').value = info.start; $('end').value = info.end;
  const lastYear = info.end.slice(0, 4);
  $('mapStart').value = `${lastYear}-01-01`; $('mapEnd').value = info.end;
  await Promise.all([loadMap(), loadSeries()]);
}

async function loadMap() {
  const d = await getJSON(`/api/map?start=${$('mapStart').value}&end=${$('mapEnd').value}&step=2`);
  const trace = { type: 'heatmap', x: d.lon, y: d.lat, z: d.z, colorscale: 'YlGnBu',
    colorbar: { title: 'mm', thickness: 12 }, hovertemplate: '%{y:.2f}, %{x:.2f}<br>%{z} mm<extra></extra>' };
  const layout = { ...baseLayout(), title: { text: `Acumulado ${d.start} → ${d.end}`, font: { size: 14 } },
    xaxis: { title: 'Lon' }, yaxis: { title: 'Lat', scaleanchor: 'x' } };
  await Plotly.react('map', [trace], layout, { responsive: true });
  $('map').removeAllListeners?.('plotly_click');
  $('map').on('plotly_click', ev => {
    const p = ev.points[0];
    $('lat').value = p.y.toFixed(2); $('lon').value = p.x.toFixed(2); $('mode').value = 'point';
    loadSeries();
  });
}

async function loadSeries() {
  const q = new URLSearchParams({ freq: $('freq').value, start: $('start').value, end: $('end').value });
  let url = '/api/timeseries/region?' + q;
  if ($('mode').value === 'point') { q.set('lat', $('lat').value); q.set('lon', $('lon').value); url = '/api/timeseries/point?' + q; }
  try {
    const d = await getJSON(url);
    const isDaily = d.freq === 'D';
    const trace = isDaily
      ? { type: 'scatter', mode: 'lines', x: d.dates, y: d.values, line: { color: css('--accent'), width: 1.2 }, name: 'mm/día' }
      : { type: 'bar', x: d.dates, y: d.values, marker: { color: css('--accent') }, name: 'mm' };
    const layout = { ...baseLayout(), title: { text: d.label, font: { size: 14 } },
      yaxis: { title: d.units }, xaxis: { rangeslider: { visible: true }, type: 'date' } };
    await Plotly.react('ts', [trace], layout, { responsive: true });
    const s = d.stats;
    $('stats').innerHTML = `<div>Total<b>${s.total_mm} mm</b></div><div>Promedio<b>${s.mean ?? '—'}</b></div>
      <div>Máximo<b>${s.max ?? '—'}</b></div><div>Fecha del máximo<b>${s.max_date ?? '—'}</b></div>`;
  } catch (e) { $('stats').textContent = 'Error: ' + e.message; }
}
init().catch(e => $('meta').textContent = 'Error: ' + e.message);
</script>
</body>
</html>
